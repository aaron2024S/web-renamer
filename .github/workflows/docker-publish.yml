name: 构建并推送镜像

# 只在需要时手动触发，不做自动构建
on:
  workflow_dispatch:
    inputs:
      tag:
        description: '镜像标签（例如 latest、1.0.0）'
        required: true
        default: 'latest'
      platforms:
        description: '目标平台'
        required: true
        type: choice
        default: 'linux/amd64,linux/arm64'
        options:
          - 'linux/amd64,linux/arm64'
          - 'linux/amd64'
          - 'linux/arm64'
      push:
        description: '推送到 Docker Hub（取消勾选则只构建不推送）'
        required: false
        type: boolean
        default: true
      no_cache:
        description: '不使用构建缓存'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: 构建 amd64 / arm64 镜像
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 校验 Docker Hub 密钥
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          missing=""
          [ -z "$DH_USER" ] && missing="$missing DOCKERHUB_USERNAME"
          [ -z "$DH_TOKEN" ] && missing="$missing DOCKERHUB_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::缺少仓库密钥:$missing —— 请在 Settings → Secrets and variables → Actions 里添加"
            exit 1
          fi
          echo "镜像目标：${DH_USER}/web-renamer"

      - name: 设置 QEMU（跨架构构建）
        uses: docker/setup-qemu-action@v4

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录 Docker Hub
        if: ${{ inputs.push }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 构建并推送
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          no-cache: ${{ inputs.no_cache }}
          # 关掉 provenance / sbom，产出干净的镜像清单（避免多出 unknown/unknown 条目）
          provenance: false
          sbom: false
          cache-from: ${{ inputs.no_cache && '' || 'type=gha' }}
          cache-to: ${{ inputs.no_cache && '' || 'type=gha,mode=max' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/web-renamer:${{ inputs.tag }}
          labels: |
            org.opencontainers.image.title=ReNamer Web
            org.opencontainers.image.description=自托管 Docker 版文件批量重命名工具（ReNamer 替代）
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      - name: 写入任务摘要
        run: |
          {
            echo "### 镜像构建完成"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 镜像 | \`${{ secrets.DOCKERHUB_USERNAME }}/web-renamer:${{ inputs.tag }}\` |"
            echo "| 平台 | \`${{ inputs.platforms }}\` |"
            echo "| 摘要 | \`${{ steps.build.outputs.digest }}\` |"
            echo "| 已推送 | ${{ inputs.push }} |"
          } >> "$GITHUB_STEP_SUMMARY"
