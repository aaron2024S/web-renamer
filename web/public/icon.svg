<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Web ReNamer">
  <title>Web ReNamer</title>
  <defs>
    <linearGradient id="wr-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d5efc" />
      <stop offset="1" stop-color="#b18cff" />
    </linearGradient>
  </defs>

  <!-- 背景：主题色渐变圆角方块 -->
  <rect x="0" y="0" width="64" height="64" rx="15" fill="url(#wr-bg)" />

  <!-- 文件卡片 -->
  <rect x="13" y="12.5" width="22" height="39" rx="4.5" fill="#ffffff" />
  <rect x="18" y="20" width="12" height="3" rx="1.5" fill="#6d5efc" />
  <rect x="18" y="27" width="8" height="3" rx="1.5" fill="#6d5efc" opacity="0.75" />

  <!-- 改名箭头 -->
  <path
    d="M39 32h13M46.5 25l7 7-7 7"
    fill="none"
    stroke="#ffffff"
    stroke-width="4.6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
